<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>SAVE ME</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    font-family: 'Segoe UI', Tahoma, sans-serif;
    background: #0d1117;
    color: #e6edf3;
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 20px;
  }
  .login-box {
    background: #161b22;
    border-radius: 16px;
    padding: 32px 24px;
    width: 100%;
    max-width: 380px;
    border: 1px solid #30363d;
  }
  .logo {
    text-align: center;
    font-size: 28px;
    font-weight: bold;
    margin-bottom: 8px;
    color: #e63946;
  }
  .tagline {
    text-align: center;
    color: #8b949e;
    font-size: 14px;
    margin-bottom: 28px;
  }
  .field { margin-bottom: 16px; }
  label {
    display: block;
    font-size: 14px;
    color: #8b949e;
    margin-bottom: 6px;
  }
  input {
    width: 100%;
    padding: 12px 14px;
    border-radius: 8px;
    border: 1px solid #30363d;
    background: #0d1117;
    color: #e6edf3;
    font-size: 15px;
  }
  input:focus { outline: none; border-color: #e63946; }
  .btn {
    width: 100%;
    padding: 13px;
    border-radius: 8px;
    border: none;
    background: #e63946;
    color: white;
    font-size: 16px;
    font-weight: bold;
    cursor: pointer;
    margin-top: 8px;
  }
  .btn:disabled { opacity: 0.6; }
  .msg {
    margin-top: 14px;
    padding: 10px;
    border-radius: 8px;
    font-size: 14px;
    text-align: center;
    display: none;
  }
  .msg.show { display: block; }
  .msg.err { background: rgba(230,57,70,0.15); color: #ff8080; }
  .msg.ok { background: rgba(46,160,67,0.15); color: #56d364; }
</style>
</head>
<body>

<div class="login-box">
  <div class="logo">SAVE ME</div>
  <div class="tagline">نظام حماية ومتابعة</div>

  <div class="field">
    <label>البريد الإلكتروني</label>
    <input type="email" id="loginEmail" placeholder="name@example.com" autocomplete="email">
  </div>

  <div class="field">
    <label>كلمة السر</label>
    <input type="password" id="loginPassword" placeholder="••••••••" autocomplete="current-password">
  </div>

  <button class="btn" id="btnLogin">تسجيل الدخول</button>
  <div class="msg" id="msgLogin"></div>
</div>

<script>
const SUPABASE_URL = "ضع_رابط_مشروع_SAVE_ME_هنا";
const ANON_KEY = "ضع_مفتاح_anon_هنا";

const LOGIN_FN = "saveme-login"; // اسم الدالة الحقيقي، أو الاسم المستعار

function fnUrl(name){ return `${SUPABASE_URL}/functions/v1/${name}`; }
function headers(){
  return {
    "Content-Type": "application/json",
    "Authorization": `Bearer ${ANON_KEY}`,
    "apikey": ANON_KEY
  };
}

function showMsg(text, type){
  const el = document.getElementById('msgLogin');
  el.textContent = text;
  el.className = 'msg show ' + type;
}

document.getElementById('btnLogin').addEventListener('click', async ()=>{
  const email = document.getElementById('loginEmail').value.trim();
  const password = document.getElementById('loginPassword').value;

  if(!email || !password){
    showMsg('عمّر البريد وكلمة السر.', 'err');
    return;
  }

  const btn = document.getElementById('btnLogin');
  btn.disabled = true; btn.textContent = 'جاري الدخول...';

  try{
    const res = await fetch(fnUrl(LOGIN_FN), {
      method:'POST', headers: headers(),
      body: JSON.stringify({ email, password })
    });
    const data = await res.json();

    if(data.success){
      sessionStorage.setItem('saveme_user_id', data.user_id);
      window.location.href = "saveme-dashboard.html?uid=" + data.user_id;
    } else {
      showMsg(data.error || 'بيانات الدخول غير صحيحة.', 'err');
    }
  }catch(e){
    showMsg('تعذر الاتصال بالسيرفر.', 'err');
  }finally{
    btn.disabled = false; btn.textContent = 'تسجيل الدخول';
  }
});
</script>

</body>
</html>
