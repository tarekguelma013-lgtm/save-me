<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>SAVE ME - استرجاع الحساب</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    font-family: 'Segoe UI', Tahoma, sans-serif;
    background: #0d1117; color: #e6edf3;
    min-height: 100vh; padding: 20px;
  }
  .header { text-align: center; margin-bottom: 24px; }
  .box {
    background: #000; border: 1px solid #30363d; border-radius: 16px;
    padding: 28px 22px; max-width: 380px; margin: 0 auto;
  }
  h2 { font-size: 18px; margin-bottom: 8px; }
  .sub { color: #8b949e; font-size: 14px; margin-bottom: 20px; line-height: 1.6; }
  .field { margin-bottom: 14px; }
  label { display: block; font-size: 14px; color: #8b949e; margin-bottom: 6px; }
  input {
    width: 100%; padding: 12px 14px; border-radius: 8px;
    border: 1px solid #30363d; background: #0d1117; color: #e6edf3;
    font-size: 15px; direction: ltr;
  }
  input:focus { outline: none; border-color: #e63946; }
  .btn {
    width: 100%; padding: 13px; border-radius: 8px; border: none;
    background: #e63946; color: #fff; font-size: 16px; font-weight: bold;
    cursor: pointer; margin-top: 8px;
  }
  .btn:disabled { opacity: 0.6; }
  .msg { margin-top: 14px; font-size: 14px; text-align: center; min-height: 20px; }
  .msg.err { color: #ff8080; }
  .msg.ok { color: #56d364; }
  a { display: block; text-align: center; margin-top: 16px; color: #8b949e; font-size: 14px; text-decoration: none; }
</style>
</head>
<body>

<div class="header">
  <img src="saveme-logo.png" alt="SAVE ME" style="height:70px;width:auto;">
</div>

<div class="box">
  <h2>نسيت كلمة السر</h2>
  <div class="sub">اكتب بريدك وأحد رموز الاسترجاع المحفوظة عندك، ثم كلمة السر الجديدة.</div>

  <div class="field">
    <label>البريد الإلكتروني</label>
    <input type="email" id="email" autocomplete="email">
  </div>
  <div class="field">
    <label>رمز الاسترجاع</label>
    <input type="text" id="code" maxlength="11" placeholder="XXXXX-XXXXX" autocomplete="off" style="text-transform:uppercase;letter-spacing:2px;">
  </div>
  <div class="field">
    <label>كلمة السر الجديدة (8 خانات على الأقل)</label>
    <input type="password" id="pw1" autocomplete="new-password">
  </div>
  <div class="field">
    <label>أعد كتابة كلمة السر الجديدة</label>
    <input type="password" id="pw2" autocomplete="new-password">
  </div>

  <button class="btn" id="btnReset">تغيير كلمة السر</button>
  <div class="msg" id="msg"></div>
  <a href="saveme-portal.html">العودة لتسجيل الدخول</a>
</div>

<script>
const SUPABASE_URL = "https://bglukxiblolxsfildnol.supabase.co";
const ANON_KEY = "sb_publishable_YgDOmnqFeknhUQxGQTmwDA_neIoiVnb";
const RESET_FN = "bright-worker";

function setMsg(text, type){
  const el = document.getElementById('msg');
  el.textContent = text;
  el.className = 'msg ' + (type || '');
}

document.getElementById('code').addEventListener('input', (e)=>{
  let v = e.target.value.toUpperCase().replace(/[^A-Z0-9]/g, '').slice(0, 10);
  if(v.length > 5) v = v.slice(0, 5) + '-' + v.slice(5);
  e.target.value = v;
});

document.getElementById('btnReset').addEventListener('click', async ()=>{
  const email = document.getElementById('email').value.trim();
  const code = document.getElementById('code').value.trim();
  const pw1 = document.getElementById('pw1').value;
  const pw2 = document.getElementById('pw2').value;

  if(!email || !code || !pw1 || !pw2){ setMsg('عمّر كل الخانات.', 'err'); return; }
  if(code.replace('-', '').length !== 10){ setMsg('اكتب الرمز كاملًا (10 خانات).', 'err'); return; }
  if(pw1.length < 8){ setMsg('كلمة السر لازم تكون 8 خانات على الأقل.', 'err'); return; }
  if(pw1 !== pw2){ setMsg('كلمتا السر غير متطابقتين.', 'err'); return; }

  const btn = document.getElementById('btnReset');
  btn.disabled = true; btn.textContent = 'جاري التغيير...';
  try{
    const res = await fetch(`${SUPABASE_URL}/functions/v1/${RESET_FN}`, {
      method:'POST',
      headers: {
        "Content-Type": "application/json",
        "Authorization": `Bearer ${ANON_KEY}`,
        "apikey": ANON_KEY
      },
      body: JSON.stringify({ email, code, new_password: pw1 })
    });
    const data = await res.json();
    if(data.success){
      setMsg('تم تغيير كلمة السر. جاري تحويلك لتسجيل الدخول...', 'ok');
      setTimeout(()=>{ window.location.href = 'saveme-portal.html'; }, 2000);
    } else {
      setMsg(data.error || 'تعذرت العملية.', 'err');
    }
  }catch(e){
    setMsg('تعذر الاتصال بالسيرفر.', 'err');
  }finally{
    btn.disabled = false; btn.textContent = 'تغيير كلمة السر';
  }
});
</script>

</body>
</html>
