<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>SAVE ME - لوحة المتابعة</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    font-family: 'Segoe UI', Tahoma, sans-serif;
    background: #000000;
    color: #e6edf3;
    min-height: 100vh;
    padding: 20px;
  }
  .header {
    text-align: center;
    margin-bottom: 24px;
  }
  .header img { height: 80px; }
  .card {
    background: #111111;
    border: 1px solid #30363d;
    border-radius: 14px;
    padding: 20px;
    max-width: 480px;
    margin: 0 auto 16px;
  }
  .person-name {
    font-size: 20px;
    font-weight: bold;
    margin-bottom: 4px;
  }
  .person-category {
    color: #8b949e;
    font-size: 13px;
    margin-bottom: 16px;
  }
  .status-row {
    display: flex;
    justify-content: space-between;
    align-items: center;
    padding: 12px 0;
    border-top: 1px solid #21262d;
  }
  .status-label { color: #8b949e; font-size: 14px; }
  .status-value { font-weight: bold; font-size: 15px; }
  .badge {
    display: inline-block;
    padding: 4px 10px;
    border-radius: 20px;
    font-size: 13px;
    font-weight: bold;
  }
  .badge.normal { background: rgba(46,160,67,0.15); color: #56d364; }
  .badge.elevated { background: rgba(230,57,70,0.15); color: #ff8080; }
  .badge.absent { background: rgba(230,57,70,0.3); color: #ff4444; }
  .map-link {
    display: block;
    text-align: center;
    background: #e63946;
    color: white;
    padding: 12px;
    border-radius: 8px;
    text-decoration: none;
    font-weight: bold;
    margin-top: 12px;
  }
  .empty {
    text-align: center;
    color: #8b949e;
    padding: 40px 20px;
  }
  .loading { text-align: center; padding: 40px; color: #8b949e; }
</style>
</head>
<body>

<div class="header">
  <img src="saveme-logo.png" alt="SAVE ME" style="height: 70px; width: auto;">
</div>

<div id="dashboardContent">
  <div class="loading">جاري التحميل...</div>
</div>
 <div class="card" style="max-width: 480px; margin: 0 auto;">
  <div style="font-size: 15px; margin-bottom: 10px; color: #8b949e;">ربط جهازك (تجريبي)</div>
  <input type="text" id="deviceIdInput" placeholder="مثال: PHONE-A1" style="width:100%; padding:10px; border-radius:8px; border:1px solid #30363d; background:#0d1117; color:#e6edf3; margin-bottom:10px;">
  <button id="btnSaveDevice" style="width:100%; padding:11px; border-radius:8px; border:none; background:#e63946; color:white; font-weight:bold; cursor:pointer;">حفظ معرف الجهاز</button>
  <div class="msg" id="msgDevice" style="margin-top:10px; text-align:center; font-size:14px; display:none;"></div>
</div> 
<script>
const SUPABASE_URL = "https://bglukxiblolxsfildnol.supabase.co";
const ANON_KEY = "sb_publishable_YgDOmnqFeknhUQxGQTmwDA_neIoiVnb";
const DASHBOARD_FN = "bright-handler";

const params = new URLSearchParams(window.location.search);
const userId = params.get('uid');

if(!userId){
  window.location.href = "saveme-portal.html";
}

function fnUrl(name){ return `${SUPABASE_URL}/functions/v1/${name}`; }
function headers(){
  return {
    "Content-Type": "application/json",
    "Authorization": `Bearer ${ANON_KEY}`,
    "apikey": ANON_KEY
  };
}

function formatDate(iso){
  if(!iso) return "غير متوفر";
  const d = new Date(iso);
  return d.toLocaleString('ar', { year:'numeric', month:'short', day:'numeric', hour:'2-digit', minute:'2-digit' });
}

function heartStatusLabel(status){
  if(status === 'normal') return 'طبيعي';
  if(status === 'elevated') return 'مرتفع';
  if(status === 'absent') return 'منعدم';
  return 'غير معروف';
}

async function loadDashboard(){
  const el = document.getElementById('dashboardContent');
  try{
    const res = await fetch(fnUrl(DASHBOARD_FN), {
      method:'POST', headers: headers(),
      body: JSON.stringify({ user_id: userId })
    });
    const data = await res.json();

    if(!data.success || !data.tracked_persons || data.tracked_persons.length === 0){
      el.innerHTML = '<div class="card"><div class="empty">لا يوجد أشخاص متابَعين حاليًا.</div></div>';
      return;
    }

    el.innerHTML = '';
    data.tracked_persons.forEach(person=>{
      const hr = person.last_heart_rate;
      const loc = person.last_location;

      const card = document.createElement('div');
      card.className = 'card';
      card.innerHTML = `
        <div class="person-name">${person.full_name}</div>
        <div class="person-category">${person.category === 'minor' ? 'قاصر' : 'حالة خاصة'} · الجهاز: ${person.device_id || 'غير مرتبط'}</div>

        <div class="status-row">
          <span class="status-label">نبضات القلب</span>
          <span class="status-value">
            ${hr ? `${hr.bpm} bpm <span class="badge ${hr.status}">${heartStatusLabel(hr.status)}</span>` : 'لا توجد بيانات'}
          </span>
        </div>

        <div class="status-row">
          <span class="status-label">آخر تحديث</span>
          <span class="status-value">${formatDate(hr ? hr.recorded_at : null)}</span>
        </div>

        ${loc ? `<a class="map-link" target="_blank" href="https://www.google.com/maps?q=${loc.latitude},${loc.longitude}">عرض الموقع على الخريطة</a>` : '<div class="empty">لا يوجد موقع مسجل</div>'}
      `;
      el.appendChild(card);
    });

  }catch(e){
    el.innerHTML = '<div class="card"><div class="empty">تعذر الاتصال بالسيرفر.</div></div>';
  }
}

loadDashboard();
</script>

</body>
</html>
