<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>SAVE ME - لوحة المتابعة</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    font-family: 'Segoe UI', Tahoma, sans-serif;
    background: #000000;
    color: #e6edf3;
    min-height: 100vh;
    padding: 20px;
  }
  .header {
    text-align: center;
    margin-bottom: 24px;
  }
  .header img { height: 80px; }
  .card {
    background: #111111;
    border: 1px solid #30363d;
    border-radius: 14px;
    padding: 20px;
    max-width: 480px;
    margin: 0 auto 16px;
  }
  .person-name {
    font-size: 20px;
    font-weight: bold;
    margin-bottom: 4px;
  }
  .person-category {
    color: #8b949e;
    font-size: 13px;
    margin-bottom: 16px;
  }
  .status-row {
    display: flex;
    justify-content: space-between;
    align-items: center;
    padding: 12px 0;
    border-top: 1px solid #21262d;
  }
  .status-label { color: #8b949e; font-size: 14px; }
  .status-value { font-weight: bold; font-size: 15px; }
  .badge {
    display: inline-block;
    padding: 4px 10px;
    border-radius: 20px;
    font-size: 13px;
    font-weight: bold;
  }
  .badge.normal { background: rgba(46,160,67,0.15); color: #56d364; }
  .badge.elevated { background: rgba(230,57,70,0.15); color: #ff8080; }
  .badge.absent { background: rgba(230,57,70,0.3); color: #ff4444; }
  .map-link {
    display: block;
    text-align: center;
    background: #e63946;
    color: white;
    padding: 12px;
    border-radius: 8px;
    text-decoration: none;
    font-weight: bold;
    margin-top: 12px;
  }
  .empty {
    text-align: center;
    color: #8b949e;
    padding: 40px 20px;
  }
 
  .loading { text-align: center; padding: 40px; color: #8b949e; }
</style>
</head>
<body>

<div class="header">
  <img src="saveme-logo.png" alt="SAVE ME" style="height: 70px; width: auto;">
</div>

<div id="dashboardContent">
  <div class="loading">جاري التحميل...</div>
</div>
<div class="card" style="max-width:480px; margin:16px auto 0;">
  <div style="font-size:15px; margin-bottom:6px; color:#8b949e;">إضافة شخص للمتابعة</div>
  <div style="font-size:13px; color:#8b949e; margin-bottom:12px; line-height:1.6;">بعد الإضافة أنشئ كود الربط وأدخله في جهاز الشخص. لا يظهر موقعه إلا بعد قبوله من جهازه.</div>
  <input type="text" id="personName" maxlength="60" placeholder="الاسم" style="width:100%; padding:10px; border-radius:8px; border:1px solid #30363d; background:#0d1117; color:#e6edf3; margin-bottom:10px;">
  <select id="personCategory" style="width:100%; padding:10px; border-radius:8px; border:1px solid #30363d; background:#0d1117; color:#e6edf3; margin-bottom:10px;">
    <option value="minor">قاصر</option>
    <option value="special">حالة خاصة</option>
  </select>
  <button id="btnAddPerson" style="width:100%; padding:11px; border-radius:8px; border:none; background:#e63946; color:white; font-weight:bold; cursor:pointer;">إضافة</button>
  <div id="msgPerson" style="margin-top:10px; text-align:center; font-size:14px;"></div>
</div> 
<div class="card" style="max-width:480px; margin:16px auto 0;">
  <div style="font-size:15px; margin-bottom:6px; color:#8b949e;">رموز استرجاع الحساب</div>
  <div style="font-size:13px; color:#8b949e; margin-bottom:12px; line-height:1.6;">تحتاجها إذا نسيت كلمة السر. كل رمز يخدم مرة واحدة، وتوليد رموز جديدة يلغي القديمة.</div>
  <input type="password" id="recPw" placeholder="كلمة السر الحالية" autocomplete="current-password" style="width:100%; padding:10px; border-radius:8px; border:1px solid #30363d; background:#0d1117; color:#e6edf3; margin-bottom:10px; direction:ltr;">
  <button id="btnRecGen" style="width:100%; padding:11px; border-radius:8px; border:none; background:#e63946; color:white; font-weight:bold; cursor:pointer;">توليد رموز جديدة</button>
  <pre id="recCodes" style="display:none; margin-top:12px; padding:12px; border:1px dashed #e63946; border-radius:8px; text-align:center; font-size:16px; letter-spacing:2px; line-height:1.9; direction:ltr; user-select:all;"></pre>
  <button id="btnRecCopy" style="display:none; width:100%; padding:11px; border-radius:8px; border:1px solid #30363d; background:none; color:#e6edf3; cursor:pointer; margin-top:10px;">نسخ الرموز</button>
  <div id="msgRec" style="margin-top:10px; text-align:center; font-size:14px;"></div>
</div> 
<script>
const SUPABASE_URL = "https://bglukxiblolxsfildnol.supabase.co";
const ANON_KEY = "sb_publishable_YgDOmnqFeknhUQxGQTmwDA_neIoiVnb";
const DASHBOARD_FN = "bright-handler";

const sessionToken = sessionStorage.getItem('saveme_session_token');

if(!sessionToken){
  window.location.href = "saveme-portal.html";
}

function fnUrl(name){ return `${SUPABASE_URL}/functions/v1/${name}`; }
function headers(){
  return {
    "Content-Type": "application/json",
    "Authorization": `Bearer ${ANON_KEY}`,
    "apikey": ANON_KEY
  };
}

function formatDate(iso){
  if(!iso) return "غير متوفر";
  const d = new Date(iso);
  return d.toLocaleString('ar', { year:'numeric', month:'short', day:'numeric', hour:'2-digit', minute:'2-digit' });
}

function heartStatusLabel(status){
  if(status === 'normal') return 'طبيعي';
  if(status === 'elevated') return 'مرتفع';
  if(status === 'absent') return 'منعدم';
  return 'غير معروف';
}
 function esc(s){
  return String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
}
async function loadDashboard(){
  const el = document.getElementById('dashboardContent');
  try{
    const res = await fetch(fnUrl(DASHBOARD_FN), {
      method:'POST', headers: headers(),
      body: JSON.stringify({ session_token: sessionToken })
    });
    const data = await res.json();
if(res.status === 401){
      sessionStorage.removeItem('saveme_session_token');
      window.location.href = "saveme-portal.html";
      return;
    }
    if(!data.success || !data.tracked_persons || data.tracked_persons.length === 0){
      el.innerHTML = '<div class="card"><div class="empty">لا يوجد أشخاص متابَعين حاليًا.</div></div>';
      return;
    }

    el.innerHTML = '';
    data.tracked_persons.forEach(person=>{
      const hr = person.last_heart_rate;
      const loc = person.last_location;

      const card = document.createElement('div');
      card.className = 'card';
      card.innerHTML = `
        <div class="person-name">${esc(person.full_name)}</div>
       <div class="person-category">${person.category === 'minor' ? 'قاصر' : 'حالة خاصة'} · الجهاز: ${person.pairing && person.pairing.status === 'accepted' ? 'مرتبط' : 'غير مرتبط'}</div> 

        <div class="status-row">
          <span class="status-label">نبضات القلب</span>
          <span class="status-value">
            ${hr ? `${hr.bpm} bpm <span class="badge ${hr.status}">${heartStatusLabel(hr.status)}</span>` : 'لا توجد بيانات'}
          </span>
        </div>

        <div class="status-row">
         <span class="status-label">آخر قراءة للنبض</span> 
          <span class="status-value">${formatDate(hr ? hr.recorded_at : null)}</span>
        </div>
<div class="status-row">
          <span class="status-label">آخر موقع</span>
          <span class="status-value">${formatDate(loc ? loc.recorded_at : null)}</span>
        </div>
        ${loc ? `<a class="map-link" target="_blank" href="https://www.google.com/maps?q=${loc.latitude},${loc.longitude}">عرض الموقع على الخريطة</a>` : '<div class="empty">لا يوجد موقع مسجل</div>'}
        <div class="pair-box"></div>
      `;
      el.appendChild(card);
     renderPairBox(card.querySelector('.pair-box'), person);
    });

  }catch(e){
    el.innerHTML = '<div class="card"><div class="empty">تعذر الاتصال بالسيرفر.</div></div>';
  }
}
const PAIR_CREATE_FN = "swift-service";
const PAIR_REVOKE_FN = "swift-worker";

async function pairCall(fn, payload){
  const res = await fetch(fnUrl(fn), {
    method:'POST', headers: headers(),
    body: JSON.stringify({ session_token: sessionToken, ...payload })
  });
  if(res.status === 401){
    sessionStorage.removeItem('saveme_session_token');
    window.location.href = "saveme-portal.html";
  }
  return res.json();
}

function pairIsOpen(p){
  return !!p && (p.status === 'accepted' ||
    (p.status === 'pending' && new Date(p.expires_at) > new Date()));
}

function renderPairBox(box, person){
  const p = person.pairing;
  box.style.cssText = 'border-top:1px solid #21262d;margin-top:12px;padding-top:12px;font-size:14px;';
  box.innerHTML = '';
 delete box.dataset.code;
  const info = document.createElement('div');
  info.style.color = (p && p.status === 'accepted') ? '#56d364' : '#8b949e';
  info.textContent = !pairIsOpen(p) ? 'لا يوجد جهاز مرتبط'
    : p.status === 'accepted' ? 'جهاز المتتبَع مرتبط'
    : 'في انتظار إدخال الكود في الجهاز';
  const btn = document.createElement('button');
  btn.style.cssText = 'width:100%;padding:11px;border-radius:8px;border:none;background:#e63946;color:white;font-weight:bold;cursor:pointer;margin-top:10px;';
  btn.textContent = pairIsOpen(p) ? 'إلغاء الربط' : 'إنشاء كود الربط';
  const msg = document.createElement('div');
  msg.style.cssText = 'margin-top:8px;text-align:center;';
  box.append(info, btn, msg);

  btn.addEventListener('click', async ()=>{
    btn.disabled = true;
    try{
      if(pairIsOpen(person.pairing)){
        if(!confirm('إلغاء الربط؟')) return;
        const d = await pairCall(PAIR_REVOKE_FN, { tracked_person_id: person.id });
        if(d.success){ person.pairing = null; renderPairBox(box, person); return; }
        msg.style.color = '#ff8080';
        msg.textContent = d.error || 'تعذر الإلغاء.';
      } else {
        const d = await pairCall(PAIR_CREATE_FN, { tracked_person_id: person.id });
        if(d.success){
          person.pairing = { status:'pending', expires_at: d.expires_at };
          info.textContent = 'أدخل هذا الكود في جهاز المتتبَع خلال 15 دقيقة';
          msg.style.cssText = 'margin-top:10px;padding:12px;border:1px dashed #e63946;border-radius:8px;text-align:center;font-size:22px;letter-spacing:3px;direction:ltr;user-select:all;';
          msg.textContent = d.code;
         box.dataset.code = '1';
          btn.textContent = 'إلغاء الربط';
        } else {
          msg.style.color = '#ff8080';
          msg.textContent = d.error || 'تعذر إنشاء الكود.';
        }
      }
    }catch(e){
      msg.style.color = '#ff8080';
      msg.textContent = 'تعذر الاتصال بالسيرفر.';
    }finally{ btn.disabled = false; }
  });
}
loadDashboard();
setInterval(()=>{
  if(document.hidden) return;
  if(document.querySelector('.pair-box[data-code="1"]')) return;
  loadDashboard();
}, 20000);
const RECOVERY_GEN_FN = "bright-service";
const PERSON_ADD_FN = "bright-task";

document.getElementById('btnAddPerson').addEventListener('click', async ()=>{
  const name = document.getElementById('personName').value.trim();
  const category = document.getElementById('personCategory').value;
  const msgEl = document.getElementById('msgPerson');
  if(name.length < 2){
    msgEl.style.color = '#ff8080';
    msgEl.textContent = 'اكتب الاسم (حرفان على الأقل).';
    return;
  }
  const btn = document.getElementById('btnAddPerson');
  btn.disabled = true;
  try{
    const d = await pairCall(PERSON_ADD_FN, { full_name: name, category });
    if(d.success){
      document.getElementById('personName').value = '';
      msgEl.style.color = '#56d364';
      msgEl.textContent = 'تمت الإضافة. أنشئ كود الربط من بطاقته.';
      loadDashboard();
    } else {
      msgEl.style.color = '#ff8080';
      msgEl.textContent = d.error || 'تعذرت الإضافة.';
    }
  }catch(e){
    msgEl.style.color = '#ff8080';
    msgEl.textContent = 'تعذر الاتصال بالسيرفر.';
  }finally{
    btn.disabled = false;
  }
});
function recMsg(text, color){
  const el = document.getElementById('msgRec');
  el.textContent = text;
  el.style.color = color || '#8b949e';
}

document.getElementById('btnRecGen').addEventListener('click', async ()=>{
  const pw = document.getElementById('recPw').value;
  if(!pw){ recMsg('اكتب كلمة السر الحالية.', '#ff8080'); return; }
  if(!confirm('الرموز القديمة غير المستعملة ستُلغى. تكمل؟')) return;
  const btn = document.getElementById('btnRecGen');
  btn.disabled = true;
  try{
    const d = await pairCall(RECOVERY_GEN_FN, { current_password: pw });
    if(d.success){
      const box = document.getElementById('recCodes');
      box.textContent = d.codes.join('\n');
      box.style.display = 'block';
      document.getElementById('btnRecCopy').style.display = 'block';
      document.getElementById('recPw').value = '';
      recMsg('احفظها الآن في مكان آمن، ما تظهر مرة أخرى.', '#56d364');
    } else {
      recMsg(d.error || 'تعذر التوليد.', '#ff8080');
    }
  }catch(e){
    recMsg('تعذر الاتصال بالسيرفر.', '#ff8080');
  }finally{
    btn.disabled = false;
  }
});

document.getElementById('btnRecCopy').addEventListener('click', async ()=>{
  try{
    await navigator.clipboard.writeText(document.getElementById('recCodes').textContent);
    recMsg('تم النسخ.', '#56d364');
  }catch(e){
    recMsg('تعذر النسخ، حددها يدويًا.', '#ff8080');
  }
}); 
</script>

</body>
</html>
