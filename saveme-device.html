<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>SAVE ME - ربط الجهاز</title>
<link rel="manifest" href="device.webmanifest">
<meta name="theme-color" content="#000000">
<link rel="apple-touch-icon" href="apple-touch-icon.png?v=2">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    font-family: 'Segoe UI', Tahoma, sans-serif;
    background: #000; color: #e6edf3;
    min-height: 100vh; padding: 20px;
  }
  .header { text-align: center; margin-bottom: 24px; }
  .card {
    background: #111; border: 1px solid #30363d; border-radius: 14px;
    padding: 20px; max-width: 420px; margin: 0 auto 16px;
  }
  h2 { font-size: 18px; margin-bottom: 8px; }
  .sub { color: #8b949e; font-size: 14px; margin-bottom: 16px; line-height: 1.6; }
  input {
    width: 100%; padding: 14px; border-radius: 8px; border: 1px solid #30363d;
    background: #0d1117; color: #e6edf3; font-size: 22px; letter-spacing: 3px;
    text-align: center; direction: ltr; text-transform: uppercase;
  }
  input:focus { outline: none; border-color: #e63946; }
  .btn {
    width: 100%; padding: 13px; border-radius: 8px; border: none;
    background: #e63946; color: #fff; font-size: 16px; font-weight: bold;
    cursor: pointer; margin-top: 12px;
  }
  .btn.secondary { background: none; border: 1px solid #e63946; color: #ff8080; }
  .btn:disabled { opacity: 0.6; }
  .msg { margin-top: 14px; font-size: 14px; text-align: center; min-height: 20px; }
  .msg.err { color: #ff8080; }
  .msg.ok { color: #56d364; }
  .msg.warn { color: #e3b341; }
  .badge {
    display: inline-block; padding: 6px 14px; border-radius: 20px;
    background: rgba(46,160,67,0.15); color: #56d364; font-weight: bold;
  }
</style>
</head>
<body>

<div class="header">
  <img src="saveme-logo.png" alt="SAVE ME" style="height:70px;width:auto;">
</div>

<div class="card" id="viewCode">
  <h2>ربط هذا الجهاز</h2>
  <div class="sub">اكتب الكود الذي ظهر عند الشخص المسؤول عنك في لوحة المتابعة. الكود صالح 10 دقائق فقط.</div>
  <input type="text" id="codeInput" maxlength="9" placeholder="XXXX-XXXX" autocomplete="off">
  <button class="btn" id="btnAccept">قبول الربط</button>
  <div class="msg" id="msgCode"></div>
</div>

<div class="card" id="viewLinked" style="display:none;">
  <h2>الجهاز مرتبط</h2>
  <div class="sub">موقعك يظهر للشخص المسؤول عنك طالما هذه الصفحة مفتوحة. اترك الصفحة مفتوحة ولا تقفل الشاشة. تقدر تلغي الربط في أي وقت.</div>
  <div style="text-align:center;"><span class="badge">مرتبط</span></div>
  <div class="msg" id="locStatus">جاري تحديد الموقع...</div>
  <div class="msg" id="wakeStatus"></div>
  <div class="msg" id="queueStatus"></div>
  <button class="btn secondary" id="btnRevoke">إلغاء الربط</button>
  <div class="msg" id="msgLinked"></div>
</div>

<script>
const SUPABASE_URL = "https://bglukxiblolxsfildnol.supabase.co";
const ANON_KEY = "sb_publishable_YgDOmnqFeknhUQxGQTmwDA_neIoiVnb";
const ACCEPT_FN = "clever-endpoint";
const REVOKE_FN = "swift-worker";
const PING_FN = "smooth-responder";
const QUEUE_KEY = "saveme_queue";
const QUEUE_MAX = 50;

function fnUrl(name){ return `${SUPABASE_URL}/functions/v1/${name}`; }
function headers(){
  return {
    "Content-Type": "application/json",
    "Authorization": `Bearer ${ANON_KEY}`,
    "apikey": ANON_KEY
  };
}

function setMsg(id, text, type){
  const el = document.getElementById(id);
  el.textContent = text;
  el.className = 'msg ' + (type || '');
}

let watchId = null;
let lastSent = 0;
let wakeLock = null;
let flushing = false;

function clearLink(){
  localStorage.removeItem('saveme_pairing_id');
  localStorage.removeItem('saveme_device_secret');
  localStorage.removeItem(QUEUE_KEY);
}

/* ===== الشاشة المضاءة (Wake Lock) ===== */
async function requestWake(){
  const el = 'wakeStatus';
  if(!('wakeLock' in navigator)){
    setMsg(el, 'المتصفح لا يدعم إبقاء الشاشة مضاءة. لا تقفل الشاشة.', 'warn');
    return;
  }
  try{
    wakeLock = await navigator.wakeLock.request('screen');
    wakeLock.addEventListener('release', ()=>{ wakeLock = null; });
    setMsg(el, 'الشاشة ستبقى مضاءة أثناء الإرسال.', 'ok');
  }catch(e){
    setMsg(el, 'تعذر إبقاء الشاشة مضاءة. لا تقفل الشاشة.', 'warn');
  }
}
function releaseWake(){
  if(wakeLock){ wakeLock.release().catch(()=>{}); wakeLock = null; }
  setMsg('wakeStatus', '');
}

/* ===== طابور المواقع عند انقطاع الإنترنت ===== */
function getQueue(){
  try{ return JSON.parse(localStorage.getItem(QUEUE_KEY) || '[]'); }
  catch(e){ return []; }
}
function setQueue(q){
  localStorage.setItem(QUEUE_KEY, JSON.stringify(q.slice(-QUEUE_MAX)));
  const n = getQueue().length;
  setMsg('queueStatus', n ? `مواقع بانتظار الإرسال: ${n}` : '', n ? 'warn' : '');
}

function postPing(point, queued){
  const payload = {
    pairing_id: localStorage.getItem('saveme_pairing_id'),
    device_secret: localStorage.getItem('saveme_device_secret'),
    latitude: point.lat,
    longitude: point.lng
  };
  if(queued) payload.recorded_at_ms = point.t;
  return fetch(fnUrl(PING_FN), { method:'POST', headers: headers(), body: JSON.stringify(payload) });
}

async function flushQueue(){
  if(flushing) return;
  flushing = true;
  try{
    let q = getQueue();
    while(q.length){
      const res = await postPing(q[0], true);
      if(res.status === 401){ clearLink(); stopTracking(); showView(); return; }
      let ok = false;
      try{ const d = await res.json(); ok = !!d.success || res.status === 400; }catch(e){}
      if(!ok) break;
      q.shift();
      setQueue(q);
    }
  }catch(e){
    /* لا إنترنت الآن: يبقى الطابور كما هو */
  }finally{
    flushing = false;
  }
}

/* ===== التتبع ===== */
function stopTracking(){
  if(watchId !== null){
    clearInterval(watchId);
    watchId = null;
  }
  releaseWake();
}

async function sendPing(pos){
  const now = Date.now();
  if(now - lastSent < 25000) return;
  lastSent = now;
  const point = { lat: pos.coords.latitude, lng: pos.coords.longitude, t: now };
  try{
    await flushQueue();
    const res = await postPing(point, false);
    if(res.status === 401){
      clearLink(); stopTracking(); showView();
      return;
    }
    const data = await res.json();
    if(data.success){
      setMsg('locStatus', 'آخر إرسال للموقع: ' + new Date().toLocaleTimeString('ar'), 'ok');
    } else if(res.status >= 500){
      setQueue(getQueue().concat([point]));
      setMsg('locStatus', 'تعذر الإرسال الآن، سيُعاد لاحقًا.', 'warn');
    } else {
      setMsg('locStatus', data.error || 'تعذر إرسال الموقع.', 'err');
    }
  }catch(e){
    setQueue(getQueue().concat([point]));
    setMsg('locStatus', 'لا يوجد إنترنت. حفظنا الموقع وسيُرسل عند عودته.', 'warn');
  }
}

function readAndSend(){
  navigator.geolocation.getCurrentPosition(
    sendPing,
    (err)=>{
      setMsg('locStatus', err.code === 1
        ? 'اسمح للمتصفح بالوصول إلى الموقع.'
        : 'تعذر تحديد الموقع.', 'err');
    },
    { enableHighAccuracy: true, maximumAge: 0, timeout: 30000 }
  );
}

function startTracking(){
  if(watchId !== null) return;
  if(!navigator.geolocation){
    setMsg('locStatus', 'هذا الجهاز لا يدعم تحديد الموقع.', 'err');
    return;
  }
  requestWake();
  setQueue(getQueue());
  readAndSend();
  watchId = setInterval(readAndSend, 30000);
}

document.addEventListener('visibilitychange', ()=>{
  if(document.visibilityState === 'visible' && watchId !== null){
    requestWake();
    lastSent = 0;
    readAndSend();
  }
});
window.addEventListener('online', ()=>{ if(watchId !== null) flushQueue(); });

function showView(){
  const linked = !!(localStorage.getItem('saveme_pairing_id') &&
                    localStorage.getItem('saveme_device_secret'));
  document.getElementById('viewCode').style.display = linked ? 'none' : '';
  document.getElementById('viewLinked').style.display = linked ? '' : 'none';
  if(linked) startTracking(); else stopTracking();
}

document.getElementById('codeInput').addEventListener('input', (e)=>{
  let v = e.target.value.toUpperCase().replace(/[^A-Z0-9]/g, '').slice(0, 8);
  if(v.length > 4) v = v.slice(0, 4) + '-' + v.slice(4);
  e.target.value = v;
});

document.getElementById('btnAccept').addEventListener('click', async ()=>{
  const code = document.getElementById('codeInput').value.trim();
  if(code.replace('-', '').length !== 8){
    setMsg('msgCode', 'اكتب الكود كاملًا (8 خانات).', 'err');
    return;
  }
  const btn = document.getElementById('btnAccept');
  btn.disabled = true; btn.textContent = 'جاري الربط...';
  try{
    const res = await fetch(fnUrl(ACCEPT_FN), {
      method:'POST', headers: headers(),
      body: JSON.stringify({ code })
    });
    const data = await res.json();
    if(data.success){
      localStorage.setItem('saveme_pairing_id', data.pairing_id);
      localStorage.setItem('saveme_device_secret', data.device_secret);
      localStorage.removeItem(QUEUE_KEY);
      document.getElementById('codeInput').value = '';
      setMsg('msgCode', '');
      lastSent = 0;
      showView();
    } else {
      setMsg('msgCode', data.error || 'تعذر الربط.', 'err');
    }
  }catch(e){
    setMsg('msgCode', 'تعذر الاتصال بالسيرفر.', 'err');
  }finally{
    btn.disabled = false; btn.textContent = 'قبول الربط';
  }
});

document.getElementById('btnRevoke').addEventListener('click', async ()=>{
  if(!confirm('إلغاء الربط؟ لن يظهر موقعك بعد الآن.')) return;
  const btn = document.getElementById('btnRevoke');
  btn.disabled = true;
  try{
    const res = await fetch(fnUrl(REVOKE_FN), {
      method:'POST', headers: headers(),
      body: JSON.stringify({
        pairing_id: localStorage.getItem('saveme_pairing_id'),
        device_secret: localStorage.getItem('saveme_device_secret')
      })
    });
    const data = await res.json();
    if(data.success || res.status === 400 || res.status === 404){
      clearLink();
      setMsg('msgLinked', '');
      showView();
    } else {
      setMsg('msgLinked', data.error || 'تعذر الإلغاء.', 'err');
    }
  }catch(e){
    setMsg('msgLinked', 'تعذر الاتصال بالسيرفر.', 'err');
  }finally{
    btn.disabled = false;
  }
});

if('serviceWorker' in navigator){
  window.addEventListener('load', () => { navigator.serviceWorker.register('sw.js').catch(() => {}); });
}
showView();
</script>

</body>
</html>
